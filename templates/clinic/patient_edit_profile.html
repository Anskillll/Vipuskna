{% extends 'clinic/base.html' %}

{% block title %}Редагувати профіль - MedClinic{% endblock %}

{% block content %}
  <div class="card">
    <h1 class="page-title">Редагувати профіль</h1>
    {% if user.profile.photo %}
      <div class="profile-photo-preview">
        <img src="{{ user.profile.photo.url }}" alt="Фото {{ user.get_full_name }}">
        <span>Поточне фото профілю</span>
      </div>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include 'clinic/_form_fields.html' %}
      <div class="actions">
        <button type="submit">Зберегти</button>
        <a class="btn secondary" href="{% url 'patient_dashboard' %}">Назад</a>
      </div>
    </form>
  </div>
{% endblock %}
