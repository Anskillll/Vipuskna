{% extends 'clinic/base.html' %}

{% block title %}Профіль лікаря - MedClinic{% endblock %}

{% block content %}
  <a class="back-link" href="{% url 'doctor_dashboard' %}">← Повернутися до кабінету лікаря</a>
  <div class="card standalone-form-card">
    <h1 class="page-title">Редагувати профіль лікаря</h1>
    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}
      {% include 'clinic/_form_fields.html' %}
      <div class="actions">
        <button type="submit">Зберегти</button>
      </div>
    </form>
  </div>
{% endblock %}
