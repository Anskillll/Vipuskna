<div class="field{% if field.field.widget.input_type == 'checkbox' %} field-checkbox{% endif %}">
  {% if field.field.widget.input_type == 'checkbox' %}
    <label class="checkbox-label" for="{{ field.id_for_label }}">
      {{ field }}
      <span>{{ field.label }}</span>
    </label>
  {% else %}
    {{ field.label_tag }}
    {{ field }}
  {% endif %}
  {% if field.help_text %}
    <div class="field-help">{{ field.help_text }}</div>
  {% endif %}
  {% for error in field.errors %}
    <div class="form-error">{{ error }}</div>
  {% endfor %}
</div>
