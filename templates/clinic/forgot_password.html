{% extends 'clinic/base.html' %}

{% block title %}Відновлення доступу - MedClinic{% endblock %}

{% block content %}
  <div class="card">
    <h1 class="page-title">Відновлення доступу</h1>
    <p class="muted">Вкажіть email. Якщо акаунт існує, адміністратор допоможе відновити доступ.</p>
    <form method="post">
      {% csrf_token %}
      {% include 'clinic/_form_fields.html' %}
      <div class="actions">
        <button type="submit">Надіслати</button>
        <a class="btn secondary" href="{% url 'home' %}">Назад</a>
      </div>
    </form>
  </div>
{% endblock %}
