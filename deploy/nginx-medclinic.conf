server {
    listen 80;
    listen [::]:80;
    server_name lclinic-ua.duckdns.org 64.226.76.174;

    return 301 https://lclinic-ua.duckdns.org$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lclinic-ua.duckdns.org;

    ssl_certificate /etc/letsencrypt/live/lclinic-ua.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lclinic-ua.duckdns.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55M;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    location /static/ {
        alias /opt/medclinic/staticfiles/;
        access_log off;
        expires 7d;
    }

    location /media/ {
        alias /opt/medclinic/media/;
        access_log off;
        expires 1d;
    }

    location / {
        include proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/medclinic/gunicorn.sock;
    }
}
