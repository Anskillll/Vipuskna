server {
    listen 80;
    listen [::]:80;
    server_name orthosmile.ianskill.me 167.71.48.181;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://orthosmile.ianskill.me$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name orthosmile.ianskill.me;

    ssl_certificate /etc/letsencrypt/live/orthosmile.ianskill.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/orthosmile.ianskill.me/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55M;
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;

    location /static/ {
        alias /opt/medclinic/staticfiles/;
        access_log off;
        expires 7d;
    }

    location ^~ /media/patient_photos/ {
        return 404;
    }

    location /media/ {
        alias /opt/medclinic/media/;
        access_log off;
        expires 1d;
    }

    location / {
        include proxy_params;
        proxy_pass http://unix:/run/medclinic/gunicorn.sock;
    }
}
